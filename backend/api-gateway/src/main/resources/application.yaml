server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: USER-SERVICE
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**

        - id: NEWS-SERVICE
          uri: http://localhost:8082
          predicates:
            - Path=/api/news/**

        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Paht=/api/ai/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payment/**