server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/user/**

            - id: news-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/news/**

            - id: ai-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/ai/**

            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payment/**

jwt:
  secret: newsapp_secret_key_which_is_very_long_for_security