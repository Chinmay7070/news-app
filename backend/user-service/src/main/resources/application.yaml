server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/newsapp_users
    username: root
    password: ${DB_PASSWORD}3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
# JWT
jwt:
  secret=${JWT_SECRET}
  expiration=86400000